name: CI/CD Pipeline - Hospital Management Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHON_VERSION: "3.10"
  IMAGE_NAME: "hospital-appointment-api"

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Code Quality, Linting & Security Static Analysis
  # ----------------------------------------------------------------------------
  lint-and-security:
    name: Code Quality & Static Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black bandit

      - name: Run Black Code Formatting Check
        run: |
          black --check --line-length 88 core appointments

      - name: Run Flake8 Linter
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 core appointments --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 core appointments --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Bandit Security Vulnerability Scanner
        run: |
          bandit -r core appointments -ll

  # ----------------------------------------------------------------------------
  # Stage 2: Automated Tests & Concurrency Verification
  # ----------------------------------------------------------------------------
  test:
    name: Automated Unit & Concurrency Tests
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run Database Migrations & Seeds
        run: |
          python manage.py migrate
          python manage.py seed_data

      - name: Execute Pytest Suite (Including Concurrency Test)
        run: |
          pytest -v --cov=appointments --cov-report=term-missing

  # ----------------------------------------------------------------------------
  # Stage 3: Container Build, Tagging & Vulnerability Scan
  # ----------------------------------------------------------------------------
  build-and-scan:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "0" # Audit mode for reporting CVEs
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # ----------------------------------------------------------------------------
  # Stage 4: Smoke Test Deployment
  # ----------------------------------------------------------------------------
  smoke-test:
    name: Docker Compose Deployment Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Local Test TLS Certificates
        run: |
          python3 scripts/generate_certs.py nginx/certs

      - name: Create Test Environment File
        run: |
          cp .env.example .env
          echo "JWT_SECRET_KEY=ci-pipeline-test-secret-key-1234567890abcdef" >> .env

      - name: Start Services via Docker Compose
        run: |
          docker compose up -d db
          sleep 5
          docker compose up -d web proxy
          sleep 10

      - name: Verify Health Probes
        run: |
          docker compose ps
          # Test Web Container Health
          docker compose exec -T web curl -f http://localhost:8000/health/liveness/
          docker compose exec -T web curl -f http://localhost:8000/health/readiness/

      - name: Teardown Services
        if: always()
        run: |
          docker compose down -v
