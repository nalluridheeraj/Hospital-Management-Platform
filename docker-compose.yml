# ==============================================================================
# Docker Compose Orchestration - Hospital Management Platform (Django)
# Architecture: Nginx Reverse Proxy (TLS/HTTPS) -> Django WSGI -> PostgreSQL 16
# Security: Network isolation, least privilege, non-root execution, healthchecks
# ==============================================================================

version: "3.8"

networks:
  internal-net:
    driver: bridge
    internal: true
  proxy-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. Database: PostgreSQL 16
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: hospital-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_secure_password_replace_me}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-hospital_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

  # ----------------------------------------------------------------------------
  # 2. Application: Django REST Framework API
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: hospital-appointment-api:latest
    container_name: hospital-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_secure_password_replace_me}@db:5432/${POSTGRES_DB:-hospital_db}
    networks:
      - internal-net
      - proxy-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/liveness/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

  # ----------------------------------------------------------------------------
  # 3. Reverse Proxy & TLS Termination: Nginx
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:1.25-alpine
    container_name: hospital-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - proxy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost/health/liveness/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
